[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "receipt-understanding-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for receipt information extraction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Santiago Redondo" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

qwen = [
  "accelerate>=1.0,<2",
  "Pillow>=10,<13",
  "pyarrow>=16,<25",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=4.57.1,<5",
]

[project.scripts]
receipt-benchmark = "receipt_benchmark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

